server:
  servlet:
    encoding:
      charset: utf-8
      force: true
  port: 80
  # [추가] 세션 추적 모드를 '쿠키'로만 제한 (URL에 안 붙게 설정)
  session:
    tracking-modes: cookie

# 2칸 공백, 탭키 절대 사용 금지!
# 로그 설정 (개발환경용)
# 로그 레벨의 개념
# ERROR > WARN > INFO > DEBUG > TRACE
logging:
  level:
    root: INFO           # 모든 라이브러리는 INFO 이상만 출력
    com.example: DEBUG   # 내 프로젝트는 DEBUG 이상 모두 출력

spring:

  # 데이터베이스 연결 설정 (MySQL)
  # - 값은 프로젝트 루트의 .env 파일에서 주입된다.
  # - :뒤의 값은 .env 가 없을 때 사용되는 기본값(fallback).
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/myblog?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  # H2 데이터베이스 웹 콘솔 활성화 (개발용)
  # localhost:8080/h2-console로 접속 가능
  h2:
    console:
      enabled: true

  # 초기 데이터 로딩 설정
  sql:
    init:
      # 2.5 이상 버전부터 명시를 해야 insert 처리 됨
      mode: never
      # 애플리케이션 시작시 실행할 SQL 파일 위치
      data-locations:
        - classpath:db/data.sql
      # SQL 파일 인코딩 설정 (한글 깨짐 방지)
      encoding: UTF-8

  # JPA 설정
  jpa:
    # Open Session in View (OSIV) 설정
    # false: 트랜잭션 종료 시 세션 종료 (권장)
    # true: 뷰 렌더링까지 세션 유지 (기본값, 비권장)
    # OSIV false일 때는 Service에서 필요한 데이터를 모두 조회하고 DTO로 변환하여 반환해야 함
    open-in-view: false
    hibernate:
      # create: 애플리케이션 시작시 테이블을 새로 생성
      # 기존 데이터는 모두 삭제됨 (개발용)
      ddl-auto: update
    # SQL 쿼리를 콘솔에 출력 (개발용 디버깅)
    show-sql: true
    properties:
      hibernate:
        # SQL 쿼리를 보기 좋게 포맷팅
        format_sql: true
        # N+1 문제 해결: LAZY 로딩 시 연관된 엔티티를 배치로 한 번에 가져오기
        # 예: 게시글 목록 조회 시 각 게시글의 작성자(User)를 개별 쿼리로 가져오는 대신
        #     배치로 묶어서 한 번에 가져옴 (IN 쿼리 사용)
        default_batch_fetch_size: 100
    # data.sql 파일을 Hibernate 초기화 이후에 실행
    defer-datasource-initialization: true

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true                    # 파일 업로드 활성화
      max-file-size: 50MB              # 개별 파일 최대 크기 (10MB)
      max-request-size: 50MB           # 전체 요청 최대 크기 (10MB)
      file-size-threshold: 2KB         # 메모리에 저장할 임계값 (2KB 이상이면 디스크에 저장)

  # 이메일 발송 설정
  mail:
    # SMTP 서버 호스트 주소 (Google의 경우 smtp.gmail.com 고정)
    host: smtp.gmail.com
    # SMTP 서버 포트 번호 (587: TLS(Transport Layer Security) 암호화 통신 전용 포트)
    # 인터넷으로 정보를 주고받을 때 정보를 암호화해서 아무도 훔쳐보지 못하게 하는 보안 기술
    port: 587
    # 발신자 계정 (본인의 전체 Gmail 주소) - .env 에서 주입
    username: ${MAIL_USERNAME}
    # 발신자 인증 키 (Google 보안 설정에서 생성한 16자리 앱 비밀번호) - .env 에서 주입
    # 주의: 일반 구글 로그인 비밀번호가 아님
    password: ${MAIL_PASSWORD}
    # JavaMail 추가 속성 설정
    properties:
      mail:
        smtp:
          # SMTP 서버 인증 활성화 (ID/PW 검사 여부)
          auth: true
          # STARTTLS 설정 (보안 연결)
          starttls:
            # 비암호화 연결을 암호화 연결(TLS)로 승격 활성화
            enable: true
            # TLS 연결을 강제할지 여부 (보안상 true 권장)
            required: true
          # [타임아웃 설정 - 서버 간 통신 기준]
          # 소켓 연결 제한 시간 (단위: 밀리초)
          # 서버에 접속을 시도할 때 5초(5000ms) 동안 응답이 없으면 연결 실패 처리
          connectiontimeout: 5000
          # 소켓 읽기 제한 시간 (단위: 밀리초)
          # 메일 전송 요청 후 서버로부터 응답(Response)을 기다리는 최대 시간
          timeout: 5000
          # 소켓 쓰기 제한 시간 (단위: 밀리초)
          # 데이터를 서버로 전송할 때 걸리는 최대 허용 시간
          writetimeout: 5000


oauth:
  kakao:
    # 카카오 클라이언트 ID (.env 파일에서 환경 변수로 주입)
    # IntelliJ IDEA: Run Configuration > EnvFile 탭에서 .env 파일 선택
    # 또는 Run Configuration > Environment variables에서 직접 설정
    client-id: ${KAKAO_CLIENT_ID}
    secret: ${KAKAO_CLIENT_SECRET}

tenco:
  # 소셜 로그인 사용자 임시 비밀번호 키 (.env 파일에서 환경 변수로 주입)
  # IntelliJ IDEA: Run Configuration > EnvFile 탭에서 .env 파일 선택
  # 또는 Run Configuration > Environment variables에서 직접 설정
  key: ${TENCO_KEY}


portone:
  # 포트원(PortOne) 설정
  # REST API Key (포트원 관리자 페이지의 "REST API Key" 값 - 숫자로 된 긴 값)
  # 주의: imp10344777 같은 값이 아니라 0158165733221527 같은 숫자 값이어야 함
  imp-key: ${IMP_REST_API_KEY}
  # REST API Secret (imp_secret)
  imp-secret: ${IMP_SECRET_KEY}